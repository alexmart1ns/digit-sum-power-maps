[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dspm"
version = "1.0.0"
description = "Iterated digit-sum power maps f_{k,b}(n) = S_b(n^k): attractors, basin densities, and the intra-signature split"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Martins" }]
keywords = [
    "discrete dynamical systems",
    "digit sums",
    "happy numbers",
    "modular arithmetic",
    "attractor basins",
    "natural density",
    "power digraphs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
# gmpy2 is a pure speedup: every code path has a stdlib fallback.
fast = ["gmpy2>=2.1"]
# Only the auxiliary regression script needs numpy.
stats = ["numpy>=1.24"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/alexmart1ns/digit-sum-power-maps"
Documentation = "https://zenodo.org/records/22181953"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests", "verification"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]        # _bootstrap must run before dspm imports
"verification/*.py" = ["E402"]
"verification/audit/*.py" = ["E402"]
